<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=2) }}">
</head>
<body>
  <main class="chat-shell">
    <header>
      <div class="model-mark" aria-hidden="true">F</div>
      <div><h1>{{ app_name }}</h1><p>Understand emerging skills and set your learning priorities.</p></div>
      <span class="local-badge">LOCAL</span>
    </header>
    {% set active_page = "chat" %}{% include "_nav.html" %}
    <div class="chat-controls"><button id="start-over" class="start-over" type="button">Start over</button></div>
    <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversation"></section>
    <div id="interview-area" class="interview-area" hidden></div>
    <form id="chat-form" class="composer" hidden>
      <label class="sr-only" for="message-input">Your message</label>
      <textarea id="message-input" rows="1" placeholder="Ask about skills and work trends…" required></textarea>
      <button id="send-button" type="submit" aria-label="Send message"><span>Send</span><span aria-hidden="true">↑</span></button>
    </form>
    <p class="footnote">Guidance is based on reports in the document collection. The assistant does not have university course information.</p>
  </main>
  <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
</body>
</html>
